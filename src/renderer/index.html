<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self' ws://localhost:* http://localhost:*; font-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>BubaSSH</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <div id="titlebar">
        <div class="tb-brand">BubaSSH</div>
        <div class="tb-spacer"></div>
        <div class="tb-controls">
          <button class="tb-btn" id="tb-min" title="Minimize" aria-label="Minimize">
            <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1" y1="5" x2="9" y2="5" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
          <button class="tb-btn" id="tb-max" title="Maximize" aria-label="Maximize">
            <svg width="10" height="10" viewBox="0 0 10 10"><rect x="1.2" y="1.2" width="7.6" height="7.6" fill="none" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
          <button class="tb-btn tb-close" id="tb-close" title="Close" aria-label="Close">
            <svg width="10" height="10" viewBox="0 0 10 10"><line x1="1.5" y1="1.5" x2="8.5" y2="8.5" stroke="currentColor" stroke-width="1.2" /><line x1="8.5" y1="1.5" x2="1.5" y2="8.5" stroke="currentColor" stroke-width="1.2" /></svg>
          </button>
        </div>
      </div>
      <header id="connect-bar"></header>
      <main id="file-panel">
        <section id="local-pane" class="pane"></section>
        <section id="remote-pane" class="pane"></section>
      </main>
      <footer id="transfers"></footer>
    </div>
    <div id="modal-root"></div>
    <div id="toast-root"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
