name: build

on:
  push:
    tags: ['v*'] # push tagu vX.Y.Z → build + publikacja wydania z instalatorami
  workflow_dispatch: # ręczne uruchomienie → tylko artefakty do pobrania z Actions

permissions:
  contents: write # potrzebne do utworzenia GitHub Release i wgrania plików

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
            ebflag: --linux
          - os: macos-latest
            platform: mac
            ebflag: --mac
          - os: windows-latest
            platform: win
            ebflag: --win
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Ikony
        run: npm run icons

      - name: Kompilacja (electron-vite)
        run: npm run build

      - name: Instalatory (electron-builder)
        run: npx electron-builder ${{ matrix.ebflag }} --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false' # bez podpisywania (build niesygnowany)

      - name: Artefakty (każdy przebieg)
        uses: actions/upload-artifact@v4
        with:
          name: bubassh-${{ matrix.platform }}
          if-no-files-found: ignore
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb

      - name: Publikuj wydanie (dla tagów vX.Y.Z)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          fail_on_unmatched_files: false
          files: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
