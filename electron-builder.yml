appId: com.bubassh.app
productName: BubaSSH
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - "**/node_modules/ssh2/**"
mac:
  target:
    - dmg
    - zip
  category: public.app-category.utilities
  icon: build/icon.icns
  artifactName: ${productName}-${version}-${arch}.${ext}
win:
  target:
    - nsis
    - portable
  icon: build/icon.ico
  artifactName: ${productName}-${version}-${arch}.${ext}
nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  target:
    - AppImage
    - deb
  category: Network
  icon: build/icon.png
  maintainer: BubaSSH
  artifactName: ${productName}-${version}-${arch}.${ext}
